# Example configuration — copy to `config/subwave.yaml` in the local clone directory named subwave-ai.
#
# Substitute via environment variables (`${OLLAMA_MODEL}`) or SUBWAVE_* / OLLAMA_* /
# NAVIDROME_* / SLSKD_* overrides. Secrets are files in `paths.secrets_dir`.
# Do not commit live URLs or credentials.

server:
  host: "127.0.0.1"
  port: 8788

database:
  path: "./data/subwave.sqlite"

# Local-dev placeholders. Live Oracle examples (operator config only — never required
# source defaults): downloads=/music/downloads (landing/staging),
# library=/music/library (final). Navidrome discovers files in the library dir on its
# own ~1 minute scanner; SmartRadio does not need to startScan on the happy path.
paths:
  secrets_dir: "./secrets"
  downloads: "./data/downloads"
  staging: "./data/staging"
  library: "./data/library"

files:
  allowed_extensions: [".mp3", ".flac", ".m4a", ".ogg", ".wav"]
  max_bytes: 209715200

auth:
  admin_username: "admin"
  session_ttl_hours: 24
  cookie_name: "subwave_session"

worker:
  id: "worker-1"
  poll_ms: 500
  lease_ms: 30000
  max_attempts: 5

policy:
  require_electronic: true
  require_station_match: true
  min_confidence: 0.55
  allowed_genres: []
  blocked_artists: []
  blocked_terms: []

# Optional at boot. Empty ${OLLAMA_BASE_URL} or ${OLLAMA_MODEL} is unset (`not_configured`).
# External Ollama only. Never install/update/pull models from this app. No default model name.
# Live example (not a default): http://100.119.17.28:11434 v0.34.0. Do not hard-code qwen3:8b.
# verify_status stays unverified until an explicit successful verification. Filling in the URL does not verify.
llm:
  provider: ollama
  base_url: "${OLLAMA_BASE_URL}"
  model: "${OLLAMA_MODEL}"
  timeout_ms: 120000
  verify_status: unverified

# Optional at boot. Empty ${NAVIDROME_URL} / ${NAVIDROME_USER} (or a missing
# secrets/navidrome_password) is `not_configured`. Do not invent a host.
# Passive on the happy path: startScan is ops-only. ~1min scanner picks up /music/library.
# verify_status in this file is ignored. Test connection is the only verification.
library:
  provider: navidrome
  base_url: "${NAVIDROME_URL}"
  username: "${NAVIDROME_USER}"
  client_name: "subwave-ai"
  api_version: "1.16.1"
  verify_status: unverified

# Optional at boot. Empty ${SUBWAVE_RADIO_URL} / ${SUBWAVE_RADIO_ADMIN_USER}
# (or a missing secrets/subwave_admin_password) is `not_configured`.
# Opaque base URL (live example already includes `/api`: http://127.0.0.1:7700/api).
# Playback: GET /dj/search, then POST /dj/queue-track {id,title} (artist/album optional; HTTP 409 = never-play).
# Notify: POST /dj/say {text, mode:styled, kind:dj-speak|link} with the same admin Basic auth.
# REQUEST_ACCEPTED only after a transfer is enqueued. TRACK_READY after search shows a string id, then say, then queue.
# Do not use public POST /request for announcements. URL and admin password come from this file and secrets/.
# verify_status stays unverified until an explicit successful verification. Filling in the URL does not verify.
radio:
  provider: subwave
  base_url: "${SUBWAVE_RADIO_URL}"
  admin_user: "${SUBWAVE_RADIO_ADMIN_USER}"
  verify_status: unverified

# Optional. enabled: false, a non-slskd provider, a missing URL/key, or verify_status other than
# verified → doctor.acquire_unavailable. Landing dir is config-only (live example: /music/downloads).
# A6: verify_status becomes verified only after admin test-connection (read-only
# GET /api/v0/application and GET /api/v0/server). Saving the URL and API key does not verify.
# Soulseek username/password are not stored here. API key: secrets/slskd_api_key.
acquisition:
  enabled: false
  provider: slskd
  base_url: "${SLSKD_URL}"
  verify_status: unverified
  # Search-hit ranking (worker, deterministic, no LLM). Not edited by the settings UI.
  # max_file_size_mb and min_file_size_mb are mebibytes (1024×1024).
  # Files outside that range are not chosen.
  # Optional env: SLSKD_MAX_FILE_SIZE_MB, SLSKD_MIN_FILE_SIZE_MB.
  # A basename starting with ._ or a __MACOSX path segment is junk and is not chosen.
  # max_duration_seconds uses slskd `length` (seconds) when the file has it.
  # Omit it for no duration limit. Optional env: SLSKD_MAX_DURATION_SECONDS.
  # version_penalty_terms match the basename or a parent folder (word boundary,
  # case-insensitive). A match ranks below a clean file. When the request artist
  # or title contains that term, matching files rank above files that do not.
  # Title tokens (not artist, and not those version terms) must appear in the
  # basename or a parent folder. Omit the request title and that filter is skipped.
  # max_sample_rate (Hz) and max_bit_depth are broadcast-friendly caps (48000 and 24).
  # A file that reports a higher sample rate or bit depth is not chosen.
  # A file that omits those fields stays eligible and ranks neutral on that key.
  # Optional env: SLSKD_MAX_SAMPLE_RATE, SLSKD_MAX_BIT_DEPTH. Null disables a cap.
  # Order: extension (.flac .wav .m4a .mp3 .ogg), requested version then clean then
  # penalized, artist tokens present in the path, free upload slot then shorter
  # queue then faster upload (missing peer fields last), then quality (higher bit
  # depth, sample rate, and bit rate at or under the caps; missing bit depth and
  # sample rate are neutral; a rate above the cap is not better), size closest to
  # the same-extension median, username, filename.
  selection:
    max_file_size_mb: 200
    min_file_size_mb: 1
    max_sample_rate: 48000
    max_bit_depth: 24
    version_penalty_terms:
      - remix
      - live
      - edit
      - extended
      - radio edit
      - instrumental
      - karaoke
      - cover
      - acapella
      - a cappella
      - acappella
      - stem
      - stems
      - multitrack
      - demo
